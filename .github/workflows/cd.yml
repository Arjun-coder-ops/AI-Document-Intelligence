name: CD Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ─── 1. Database Migrations (Fail-Closed) ────────────────────────────────────
  migrate:
    name: Run Neon Database Migrations
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Drizzle Migrations (Direct Connection)
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          echo "Running Drizzle schema migrations against Neon DIRECT endpoint..."
          npm --workspace=@docsage/db run db:migrate

      - name: Verify pgvector and Schema Consistency
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          npm --workspace=@docsage/db run db:check

  # ─── 2. Container Build & Push to GHCR ───────────────────────────────────────
  publish-images:
    name: Build & Push Images to GHCR
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy API & Worker to Host (Render / Fly.io) ───────────────────────
  deploy-backend:
    name: Deploy API & Worker Services
    needs: publish-images
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger API Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_API_DEPLOY_HOOK }}" ]; then
            echo "Triggering API deployment via Render deploy hook..."
            curl -f -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
          else
            echo "RENDER_API_DEPLOY_HOOK not configured; skipping hook execution."
          fi

      - name: Trigger Worker Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}" ]; then
            echo "Triggering Worker deployment via Render deploy hook..."
            curl -f -X POST "${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}"
          else
            echo "RENDER_WORKER_DEPLOY_HOOK not configured; skipping hook execution."
          fi

  # ─── 4. Deploy Frontend to Vercel ───────────────────────────────────────────
  deploy-frontend:
    name: Deploy React Frontend to Vercel
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web

  # ─── 5. Post-Deploy Smoke Test & Canary Call ────────────────────────────────
  smoke-test:
    name: Production Canary & Health Verification
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Verify Readiness Probe
        env:
          PROD_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "PRODUCTION_API_URL secret not configured; skipping live smoke probe."
            exit 0
          fi
          echo "Probing $PROD_API_URL/health/ready..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_API_URL/health/ready" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed with HTTP 200"
              break
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 5s..."
            sleep 5
            if [ $i -eq 12 ]; then
              echo "❌ Production health probe failed after 60s"
              exit 1
            fi
          done
