name: Nightly Generation Eval & Red-Team Suite

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  nightly-benchmarks:
    name: Full Generation Eval & Red-Team Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build applications and evals
        run: npm run build

      - name: Run Full Generation Evaluation (Faithfulness & Relevance)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Executing generation evaluation harness with live LLM judges..."
          npm run eval || true

      - name: Run Adversarial Red-Team Injection Test Suite
        env:
          JWT_SECRET: super_secure_production_grade_jwt_secret_32_chars_long
          REFRESH_SECRET: super_secure_refresh_secret_at_least_32_characters_long
        run: |
          npm test -- packages/rag/src/security.test.ts apps/api/src/security/security.test.ts

      - name: Execute k6 Load Benchmark Smoke Test
        run: |
          npm run test:load

      - name: Commit Updated Benchmark Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results/
          git diff-index --quiet HEAD || git commit -m "chore(evals): record nightly benchmark and load results [skip ci]"
          git push origin main || true

      - name: Alert on Failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Nightly Generation Eval Regression [${new Date().toISOString().split('T')[0]}]`,
              body: `Nightly RAG evaluation or red-team adversarial suite failed.\n\nView details at: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['eval-regression', 'security', 'automated']
            });
