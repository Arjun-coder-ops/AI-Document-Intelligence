name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ─── 1. Quality Gate ────────────────────────────────────────────────────────
  quality:
    name: Code Quality (Lint, Typecheck, Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies with frozen lockfile
        run: npm ci

      - name: Prettier Format Check
        run: npm run format:check

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Project References Typecheck
        run: npm run typecheck

  # ─── 2. Test & Coverage Gate ────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests (PostgreSQL + pgvector)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docsage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docsage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Initialize Database & Run Migrations
        env:
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/docsage_test
        run: |
          # Apply schema migrations as postgres owner
          npm --workspace=@docsage/db run db:migrate || true

          # Create non-BYPASSRLS app_user role for API isolation testing
          psql "postgresql://postgres:postgres@localhost:5432/docsage_test" -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_user') THEN
                CREATE ROLE app_user WITH LOGIN PASSWORD 'app_user_secret' NOBYPASSRLS;
              END IF;
            END
            \$\$;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO app_user;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO app_user;
          " || true

      - name: Execute Vitest with >= 80% Coverage Gate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docsage_test
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/docsage_test
          JWT_ACCESS_SECRET: super_secure_production_grade_jwt_secret_32_chars_long
          JWT_REFRESH_SECRET: super_secure_refresh_secret_at_least_32_characters_long
          JWT_SECRET: super_secure_production_grade_jwt_secret_32_chars_long
          REFRESH_SECRET: super_secure_refresh_secret_at_least_32_characters_long
          GROQ_API_KEY: gsk_mock_test_key_for_offline_ci
          GEMINI_API_KEY: AIza_mock_test_key_for_offline_ci
          REDIS_URL: redis://localhost:6379
          EMBEDDING_DIM: 768
        run: npm run test:coverage

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── 3. Offline Retrieval Regression Gate ───────────────────────────────────
  retrieval-eval:
    name: Retrieval Eval & Regression Guard
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build evals and rag dependencies
        run: |
          npm run build --workspace=@docsage/shared
          npm run build --workspace=@docsage/rag
          npm run build --workspace=@docsage/evals

      - name: Run Deterministic Offline Retrieval Evaluation
        id: eval_run
        run: |
          npm run eval:retrieval > eval_output.txt 2>&1 || (cat eval_output.txt && exit 1)
          cat eval_output.txt

      - name: Post Eval Results to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('eval_output.txt')) {
              const output = fs.readFileSync('eval_output.txt', 'utf8');
              const tableMarker = '### Retrieval Experiment Results Matrix';
              const idx = output.indexOf(tableMarker);
              const summary = idx !== -1 ? output.slice(idx) : output;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🎯 DocSage Retrieval Evaluation Results\n\n\`\`\`text\n${summary}\n\`\`\``
              });
            }

  # ─── 4. Security Gate ───────────────────────────────────────────────────────
  security:
    name: Security Audits & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

  # ─── 5. Monorepo & Container Build Gate ──────────────────────────────────────
  build:
    name: Build Monorepo & Container Images
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages and applications
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (Cache only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: docsage-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Docker Image (Cache only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: docsage-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker Image (Cache only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: docsage-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 6. End-to-End Playwright Gate ──────────────────────────────────────────
  e2e:
    name: Playwright E2E Integration
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Test Suite
        env:
          PORT: 3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NODE_ENV: production
          SERVE_TEST: 'true'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docsage_test
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/docsage_test
          JWT_ACCESS_SECRET: super_secure_production_grade_jwt_secret_32_chars_long
          JWT_REFRESH_SECRET: super_secure_refresh_secret_at_least_32_characters_long
          JWT_SECRET: super_secure_production_grade_jwt_secret_32_chars_long
          REFRESH_SECRET: super_secure_refresh_secret_at_least_32_characters_long
          GROQ_API_KEY: gsk_mock_test_key_for_offline_ci
          GEMINI_API_KEY: AIza_mock_test_key_for_offline_ci
          REDIS_URL: redis://localhost:6379
          EMBEDDING_DIM: 768
        run: |
          npm run build
          node apps/api/dist/index.js &
          sleep 3
          npx playwright test

      - name: Upload Playwright Trace on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
